<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Banho de gelo — Gelo Health." />
    <title>Banho de gelo | Gelo Health</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add,close&display=block" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { margin: 0; font-family: 'Google Sans Flex', Arial, sans-serif; }
      #sidebar { margin: 0 0 0 auto; max-height: none; max-width: 100%; }
      #sidebar::backdrop { background: transparent; }
      button:focus-visible { outline: 2px solid #999; outline-offset: 4px; }
    </style>
  </head>
  <body class="bg-white">
    <main class="relative flex min-h-screen min-h-[100svh] items-start justify-end overflow-hidden p-6" aria-label="Banho de gelo">
      <img
        src="assets/ice-bath.png"
        alt="Pessoa relaxando em uma banheira de gelo cercada por vegetação."
        class="pointer-events-none absolute inset-0 h-full w-full object-cover object-center"
        fetchpriority="high"
      />
      <button id="open-sidebar" type="button" aria-haspopup="dialog" aria-controls="sidebar" aria-expanded="false" class="relative flex h-14 shrink-0 items-center justify-center gap-2.5 bg-white px-3 py-2.5 text-black">
        <span class="whitespace-nowrap text-base font-bold leading-normal">Banho de gelo</span>
        <span class="material-symbols-outlined shrink-0" aria-hidden="true">add</span>
      </button>
    </main>
    <dialog id="sidebar" aria-labelledby="sidebar-title" class="fixed inset-y-0 right-0 h-[100dvh] w-[332px] border border-[#393532] bg-[#0c0907] px-[22px] pb-6 pt-[17px] text-white">
      <div class="flex justify-end">
        <button id="close-sidebar" type="button" aria-label="Fechar menu" autofocus class="flex h-[42px] w-[42px] items-center justify-center bg-white text-black">
          <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
      </div>
      <h1 id="sidebar-title" class="mt-[27px] text-xs font-normal leading-[18px]">Banho de gelo</h1>
      <!-- Navigation destinations will be added when the sections and social profiles are supplied. -->
      <div class="mt-[42px] space-y-[51px]">
        <h2 class="text-2xl font-medium leading-8 tracking-[-0.5px]">O que você vai sentir</h2>
        <h2 class="text-2xl font-medium leading-8 tracking-[-0.5px]">Primeiras semanas</h2>
      </div>
      <hr class="mb-[31px] mt-[37px] border-0 border-t border-[#302d2b]" />
      <ul class="space-y-[23px] text-xs font-normal leading-[18px]" aria-label="Redes sociais">
        <li>TikTok</li>
        <li>Instagram</li>
        <li>Youtube</li>
      </ul>
    </dialog>
    <script>
      const sidebar = document.getElementById('sidebar');
      const openButton = document.getElementById('open-sidebar');
      openButton.addEventListener('click', () => {
        sidebar.showModal();
        openButton.setAttribute('aria-expanded', 'true');
      });
      document.getElementById('close-sidebar').addEventListener('click', () => sidebar.close());
      sidebar.addEventListener('click', (event) => {
        if (event.target === sidebar && event.clientX < sidebar.getBoundingClientRect().left) sidebar.close();
      });
      sidebar.addEventListener('close', () => {
        openButton.setAttribute('aria-expanded', 'false');
        openButton.focus();
      });
    </script>
  </body>
</html>
